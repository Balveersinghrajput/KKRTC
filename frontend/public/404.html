<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KKRTC-DVP</title>
    <script>
      (function () {
        var path = window.location.pathname + window.location.search;
        if (path === '/' || path === '') {
          window.location.replace('/#/');
          return;
        }
        window.location.replace('/#' + path);
      })();
    </script>
  </head>

</html>
